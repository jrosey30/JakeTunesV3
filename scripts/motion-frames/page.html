<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>motion frames</title>
<!-- The app's real stylesheets, in the app's order (App.tsx). The page move
     under test is whatever these say it is. -->
<link rel="stylesheet" href="../../src/renderer/styles/variables.css">
<link rel="stylesheet" href="../../src/renderer/styles/motion.css">
<link rel="stylesheet" href="../../src/renderer/styles/reset.css">
<link rel="stylesheet" href="../../src/renderer/styles/main-content.css">
<style>
  html, body { margin: 0; height: 100%; }
  #app { display: flex; height: 100%; }
  #sidebar { width: 200px; flex: none; background: #e6e9ee; }
  #content { flex: 1; min-width: 0; height: 100%; position: relative; overflow: hidden; }
  /* A page that looks like the heavy ones: a header, a grid of covers with
     shadows and type, and a long song table. */
  .fx-page { height: 100%; overflow-y: auto; background: var(--white, #fff); }
  .fx-head { padding: 20px 24px; font: 600 22px -apple-system; }
  .fx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; padding: 0 24px; }
  .fx-card .fx-art { aspect-ratio: 1; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .fx-card .fx-t { font: 600 12px -apple-system; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fx-card .fx-s { font: 11px -apple-system; color: #777; }
  .fx-table { margin: 24px; font: 11.25px -apple-system; }
  .fx-row { display: grid; grid-template-columns: 40px 2fr 1.4fr 1.4fr 60px; height: 18px; align-items: center; }
  .fx-row:nth-child(odd) { background: #f3f6fa; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar"></div>
  <div id="content">
    <div class="main-content-shell">
      <div class="main-content-shell-view">
        <div class="main-content-view" id="view"></div>
      </div>
    </div>
  </div>
</div>
<script src="./page.js"></script>
</body>
</html>

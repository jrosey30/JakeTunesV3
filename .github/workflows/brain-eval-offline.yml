name: brain-eval offline

on:
  pull_request:
    branches: [brain-eval]
  push:
    branches: [brain-eval, fix/audit-evaluation-20261110-publish]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact tested head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Install the only offline test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --no-deps numpy==2.3.5

      - name: Check evaluator and test syntax without executing modules
        run: >-
          python -m py_compile
          brain-eval/gate.py brain-eval/generation_receipt.py
          brain-eval/generation_state.py brain-eval/pick_experiment.py
          brain-eval/run_eval.py brain-eval/scorecard.py
          brain-eval/experiments/tools/drop_bare_mood.py brain-eval/tests/*.py

      - name: Run synthetic offline unit tests
        # Never invoke run_eval.py's CLI or use the host's state/profile.
        # Dependencies are already installed; Python sockets fail closed.
        env:
          HOME: ${{ runner.temp }}/brain-eval-home
          JT_STATE_DIR: ${{ runner.temp }}/brain-eval-state
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p "$HOME" "$JT_STATE_DIR"
          python -W ignore::ResourceWarning - <<'PY'
          import sys
          import unittest

          def offline_only(event, args):
              if event.startswith('socket.'):
                  raise RuntimeError('Network access is forbidden in offline tests')

          sys.addaudithook(offline_only)
          suite = unittest.defaultTestLoader.discover('brain-eval/tests')
          if suite.countTestCases() < 65:
              raise SystemExit('Expected at least 65 offline regression tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
